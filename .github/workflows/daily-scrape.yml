name: Daily IKEA Scrape

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - run: python scraper.py

      - name: Commit and push updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.js data/products.json
          git diff --staged --quiet || git commit -m "Samodejna osvežitev podatkov $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase origin master
          git push

      # Objava (push) zgornjega koraka uporabi privzeti GITHUB_TOKEN, ki po
      # GitHubovih pravilih NE sproži drugih delovnih tokov (npr. pages.yml),
      # zato stran tu objavimo neposredno, da se ne pozabi na osvežitev.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
